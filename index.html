<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYR 2026 · Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#211C2B;
  --ink-soft:#4A4358;
  --paper:#FAF6EF;
  --paper-raised:#FFFFFF;
  --line:#E4DCC9;
  --line-soft:#EEE7D6;
  --accent:#C9A227;
  --accent-deep:#8C6A14;

  --d-courage:#33518B;
  --d-opportunity:#7B5AA5;
  --d-realaction:#3D8C5C;
  --d-learning:#C97D2E;
  --d-contribution:#A73A50;

  --belt-white:#EDE9DD;
  --belt-white-line:#C9C2AB;
  --belt-yellow:#D9A62E;
  --belt-amber:#C97A2B;
  --belt-green:#4B7F52;
  --belt-blue:#3A5A8C;

  --radius:10px;
  --shadow:0 1px 2px rgba(33,28,43,0.06), 0 4px 16px rgba(33,28,43,0.05);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Fraunces',Georgia,serif;
  font-weight:600;
  margin:0;
  letter-spacing:-0.01em;
}
.mono{font-family:'IBM Plex Mono',monospace;}
::selection{background:rgba(201,162,39,0.3);}

/* ---------- Layout ---------- */
.app{display:flex; min-height:100vh;}

.sidebar{
  width:236px;
  flex-shrink:0;
  background:var(--ink);
  color:#F1EEE6;
  padding:28px 18px;
  display:flex;
  flex-direction:column;
  gap:26px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{padding:0 6px;}
.brand .eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  letter-spacing:0.14em;
  color:var(--accent);
  text-transform:uppercase;
  margin-bottom:6px;
}
.brand h1{
  color:#fff;
  font-size:22px;
  line-height:1.2;
}
.brand .sub{
  font-size:12px;
  color:#B4ADC2;
  margin-top:8px;
}

nav.navlist{display:flex; flex-direction:column; gap:3px;}
.navlist button{
  all:unset;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:8px;
  font-size:13.5px;
  font-weight:500;
  color:#D8D2E6;
  transition:background 0.15s, color 0.15s;
}
.navlist button .num{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:#8A82A0;
  width:16px;
}
.navlist button:hover{background:rgba(255,255,255,0.06); color:#fff;}
.navlist button.active{background:var(--accent); color:#241A05; font-weight:600;}
.navlist button.active .num{color:#241A05; opacity:0.6;}

.belt-legend{
  margin-top:auto;
  padding:14px 12px;
  background:rgba(255,255,255,0.045);
  border-radius:10px;
  font-size:11px;
  color:#B4ADC2;
}
.belt-legend .lg-title{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:#8A82A0;
  margin-bottom:8px;
}
.belt-row{display:flex; align-items:center; gap:8px; margin-bottom:5px;}
.belt-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0; box-shadow:inset 0 0 0 1px rgba(0,0,0,0.15);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:16px 32px;
  border-bottom:1px solid var(--line);
  background:rgba(250,246,239,0.92);
  backdrop-filter:blur(6px);
  position:sticky;
  top:0;
  z-index:20;
}
.topbar .filters{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.topbar .right{display:flex; align-items:center; gap:10px;}

.page-title-block .eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--accent-deep);
}
.page-title-block h2{font-size:20px;}

.content{padding:28px 32px 60px; max-width:1400px;}

.page{display:none;}
.page.active{display:block;}

/* ---------- Buttons / inputs ---------- */
button.btn{
  all:unset;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 14px;
  border-radius:8px;
  font-size:12.5px;
  font-weight:600;
  background:var(--ink);
  color:#fff;
  transition:opacity 0.15s;
}
button.btn:hover{opacity:0.85;}
button.btn.ghost{
  background:transparent;
  color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--line);
}
button.btn.ghost:hover{background:var(--line-soft); opacity:1;}
button.btn.small{padding:6px 10px; font-size:11.5px;}

input[type=text], input[type=search], textarea, select{
  font-family:'Inter',sans-serif;
  font-size:13px;
  border:1px solid var(--line);
  background:var(--paper-raised);
  border-radius:8px;
  padding:8px 11px;
  color:var(--ink);
  outline:none;
}
input[type=text]:focus, textarea:focus, select:focus{box-shadow:0 0 0 2px rgba(201,162,39,0.3); border-color:var(--accent);}

/* ---------- Multiselect dropdown ---------- */
.msel{position:relative;}
.msel-btn{
  all:unset;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 11px;
  border-radius:8px;
  font-size:12.5px;
  background:var(--paper-raised);
  box-shadow:inset 0 0 0 1px var(--line);
  color:var(--ink-soft);
  white-space:nowrap;
}
.msel-btn:hover{box-shadow:inset 0 0 0 1px var(--accent);}
.msel-btn .lbl{font-weight:600; color:var(--ink);}
.msel-btn .count{
  background:var(--accent);
  color:#241A05;
  border-radius:20px;
  font-size:10px;
  font-weight:700;
  padding:1px 6px;
  font-family:'IBM Plex Mono',monospace;
}
.msel-panel{
  display:none;
  position:absolute;
  top:calc(100% + 6px);
  left:0;
  min-width:240px;
  max-height:320px;
  overflow:auto;
  background:var(--paper-raised);
  border-radius:10px;
  box-shadow:var(--shadow), 0 0 0 1px var(--line);
  padding:10px;
  z-index:50;
}
.msel.open .msel-panel{display:block;}
.msel-search{width:100%; margin-bottom:8px; box-sizing:border-box;}
.msel-opt{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 6px;
  border-radius:6px;
  font-size:12.5px;
  cursor:pointer;
}
.msel-opt:hover{background:var(--line-soft);}
.msel-opt input{margin:0;}
.msel-actions{display:flex; justify-content:space-between; margin-top:6px; padding-top:6px; border-top:1px solid var(--line-soft);}
.msel-actions a{font-size:11px; color:var(--accent-deep); cursor:pointer; font-weight:600;}

/* ---------- KPI cards ---------- */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:14px; margin-bottom:24px;}
.kpi-card{
  background:var(--paper-raised);
  border-radius:var(--radius);
  padding:16px 18px;
  box-shadow:var(--shadow);
  border-top:3px solid var(--accent);
}
.kpi-card .kpi-label{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.06em; font-family:'IBM Plex Mono',monospace;}
.kpi-card .kpi-value{font-family:'Fraunces',serif; font-size:30px; font-weight:600; margin-top:4px;}
.kpi-card .kpi-sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

.dist-cards-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(96px,1fr)); gap:10px; margin-bottom:18px;}
.dist-card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:10px;
  padding:12px 10px; text-align:center; cursor:pointer; transition:box-shadow .15s, transform .1s;
}
.dist-card:hover{box-shadow:0 3px 12px rgba(15,32,54,0.12); transform:translateY(-1px);}
.dist-card.active{outline:2px solid var(--accent-deep); background:#FBF1D6;}
.dist-card-label{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13px;}
.dist-card-value{font-family:'Fraunces',serif; font-size:26px; font-weight:600; margin-top:2px; color:var(--ink);}
.dist-card-sub{font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; margin-top:1px;}

/* ---------- Person quick-view modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(15,15,20,0.55); z-index:300;
  display:none; align-items:flex-start; justify-content:center; padding:36px 18px; overflow-y:auto;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:var(--paper-raised); border-radius:14px; max-width:740px; width:100%;
  box-shadow:0 30px 80px rgba(0,0,0,0.35); overflow:hidden; margin-bottom:36px;
}
.modal-head{background:var(--ink); color:#F1EEE6; padding:20px 24px;}
.modal-head-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px;}
.modal-head h2{font-family:'Fraunces',serif; font-size:20px; margin:0 0 3px; font-weight:600; color:#fff;}
.modal-head .role-line{font-size:12.5px; color:#C9C2AB;}
.modal-close{
  background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff;
  width:30px; height:30px; border-radius:8px; font-size:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.modal-close:hover{background:rgba(255,255,255,0.2);}
.modal-body{padding:22px 24px; max-height:76vh; overflow-y:auto;}
.modal-meta-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 20px; margin-bottom:18px;}
.modal-meta-grid .mi-label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:2px;}
.modal-meta-grid .mi-value{font-size:13.5px; font-weight:600;}
.modal-rating-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px; margin-bottom:18px;}
.modal-rating-card{border:1px solid var(--line); border-radius:10px; padding:12px; text-align:center;}
.modal-rating-card .rc-label{font-size:10px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:6px;}
.modal-rating-card .rc-value{font-family:'Fraunces',serif; font-size:22px; font-weight:600;}
.modal-rating-card .rc-trend{font-size:11px; margin-top:3px;}
.trend.up{color:#2E5C34;}
.trend.down{color:#8C3822;}
.trend.flat{color:var(--ink-soft);}
.trend-mini{
  display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
  border-radius:5px; border:1.5px solid var(--line); font-size:10.5px; font-weight:700; margin-right:2px;
}

.panel{
  background:var(--paper-raised);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px 22px;
  margin-bottom:20px;
}
.panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.panel-head h3{font-size:15.5px;}
.panel-head .desc{font-size:12px; color:var(--ink-soft); margin-top:2px; font-family:'Inter';}

.grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
@media (max-width:1100px){.grid-2{grid-template-columns:1fr;}}

/* ---------- Chips / dimension levels ---------- */
.dim-chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:600;
  color:#fff;
  white-space:nowrap;
}
.dim-chip .lvln{font-family:'IBM Plex Mono',monospace; font-size:10px; opacity:0.85;}
.dim-row{display:flex; gap:5px; flex-wrap:wrap;}

.belt-tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:11.5px;
  font-weight:600;
  color:var(--ink);
}
.belt-tag .belt-dot{width:9px; height:9px; box-shadow:inset 0 0 0 1px rgba(0,0,0,0.18);}

/* ---------- Tables ---------- */
table{width:100%; border-collapse:collapse; font-size:12.5px;}
thead th{
  text-align:left;
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:0.05em;
  color:var(--ink-soft);
  font-family:'IBM Plex Mono',monospace;
  padding:8px 10px;
  border-bottom:2px solid var(--line);
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
}
thead th:hover{color:var(--accent-deep);}
tbody td{padding:9px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
tbody tr:hover{background:var(--line-soft);}
.name-cell .full{font-weight:600;}
.name-cell .role{font-size:11px; color:var(--ink-soft);}

.table-scroll{overflow-x:auto;}

/* ---------- Rating system page ---------- */
.dim-block{margin-bottom:26px;}
.dim-block-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.dim-block-head .sw{width:14px; height:14px; border-radius:4px;}
.dim-block-head h4{font-size:16px;}
.dim-block-head .sub-en{font-size:11.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}

.ladder{display:flex; gap:6px; align-items:stretch;}
.ladder .step{
  flex:1;
  padding:12px 10px;
  border-radius:8px;
  color:#fff;
  font-size:12px;
  font-weight:500;
  position:relative;
  min-height:64px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.ladder .step .n{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  opacity:0.8;
  margin-bottom:3px;
}

/* ---------- Superior cards ---------- */
.sup-card{
  background:var(--paper-raised);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  margin-bottom:14px;
  overflow:hidden;
}
.sup-card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 18px;
  cursor:pointer;
}
.sup-card-head:hover{background:var(--line-soft);}
.sup-card-head .who{display:flex; align-items:center; gap:12px;}
.sup-card-head h4{font-size:14.5px;}
.sup-card-head .team-n{font-size:11.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
.sup-card-body{display:none; padding:0 18px 16px;}
.sup-card.open .sup-card-body{display:block;}

.analysis-block{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px;}
.analysis-title{font-size:12.5px; font-weight:700; margin-bottom:8px;}
.analysis-highlight{font-size:12px; margin-bottom:6px; padding:6px 10px; border-radius:6px;}
.analysis-highlight.down{background:#F5E1DC; color:#8C3822;}
.analysis-highlight.up{background:#E4EEE1; color:#2E5C34;}
.analysis-grid{display:flex; flex-direction:column; gap:7px; margin-top:8px;}
.analysis-row{display:flex; align-items:center; gap:10px;}
.analysis-dim{width:110px; flex-shrink:0; font-size:11.5px; font-weight:600; display:flex; align-items:center; gap:6px;}
.analysis-dim .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.analysis-bar{flex:1; display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--line-soft);}
.bar-seg.up{background:#5FA37B;}
.bar-seg.flat{background:#C9C2AB;}
.bar-seg.down{background:#C97158;}
.bar-seg.empty{background:transparent;}
.analysis-counts{width:82px; flex-shrink:0; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); text-align:right;}
.chevron{transition:transform 0.15s; color:var(--ink-soft);}
.sup-card.open .chevron{transform:rotate(90deg);}

.avg-strip{display:flex; gap:10px; flex-wrap:wrap; margin:6px 0 4px;}
.avg-pill{
  display:flex; align-items:center; gap:6px;
  font-size:11px; padding:4px 9px; border-radius:20px; background:var(--paper);
  box-shadow:inset 0 0 0 1px var(--line);
}
.avg-pill .dot{width:8px;height:8px;border-radius:50%;}

/* ---------- Notes page ---------- */
.notes-layout{display:grid; grid-template-columns:280px 1fr; gap:18px;}
@media (max-width:900px){.notes-layout{grid-template-columns:1fr;}}
.notes-sidebar{
  background:var(--paper-raised);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px;
  max-height:70vh;
  overflow:auto;
}
.notes-emp-item{
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 8px; border-radius:7px; cursor:pointer; font-size:12.5px;
}
.notes-emp-item:hover, .notes-emp-item.active{background:var(--line-soft);}
.notes-emp-item .cnt{
  font-family:'IBM Plex Mono',monospace; font-size:10px; color:#fff;
  background:var(--accent-deep); border-radius:10px; padding:1px 6px;
}
.note-entry{
  background:var(--paper);
  border-radius:8px;
  padding:12px 14px;
  margin-bottom:10px;
  box-shadow:inset 0 0 0 1px var(--line-soft);
}
.note-entry .meta{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); margin-bottom:6px; font-family:'IBM Plex Mono',monospace;}
.note-entry .txt{font-size:13px; white-space:pre-wrap;}
.note-entry .del{color:#B54834; cursor:pointer; font-size:11px; font-weight:600;}

.notes-compose textarea{width:100%; min-height:90px; resize:vertical; box-sizing:border-box; margin-bottom:8px;}
.notes-compose .row{display:flex; gap:8px; margin-bottom:8px;}
.notes-compose input[type=text]{flex:1;}
.cat-chip-group{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px;}
.cat-chip{position:relative; cursor:pointer;}
.cat-chip input{position:absolute; opacity:0; width:0; height:0;}
.cat-chip span{
  display:inline-flex; align-items:center; padding:6px 12px; border:1.5px solid var(--line);
  border-radius:8px; font-size:12px; font-weight:600; color:var(--ink-soft); background:var(--paper-raised);
  transition:all .12s;
}
.cat-chip input:checked + span{border-color:var(--accent-deep); background:#FBF1D6; color:var(--accent-deep);}
.cat-chip:hover span{border-color:var(--accent);}

.empty-state{
  text-align:center;
  padding:40px 20px;
  color:var(--ink-soft);
  font-size:13px;
}

/* ---------- Movers ---------- */
.mover-row{display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:12.5px;}
.mover-row:last-child{border-bottom:none;}
.mover-delta{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12px; padding:2px 8px; border-radius:12px;}
.mover-delta.up{background:#E4EEE1; color:#2E5C34;}
.mover-delta.down{background:#F5E1DC; color:#8C3822;}

/* ---------- Print ---------- */
@media print{
  .sidebar, .topbar, .no-print{display:none !important;}
  .main{display:block !important;}
  .content{padding:0; max-width:none;}
  .page{display:none !important;}
  .page.active{display:block !important;}
  body{background:#fff;}
  .panel, .kpi-card, .sup-card{box-shadow:none !important; break-inside:avoid;}
}

.legend-inline{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-soft); margin-top:8px;}
.legend-inline .li{display:flex; align-items:center; gap:5px;}
.legend-inline .sw{width:9px; height:9px; border-radius:3px;}

.footnote{font-size:11px; color:var(--ink-soft); margin-top:14px; line-height:1.6;}

/* ---------- Calibration board (kanban) ---------- */
.board-toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
.board-toolbar .hint{font-size:12px; color:var(--ink-soft);}
.board-wrap{overflow-x:auto; padding-bottom:6px;}
.board{display:grid; grid-template-columns:repeat(5, minmax(200px,1fr)); gap:10px; min-width:1080px;}
.board-col-head{
  padding:10px 12px;
  border-radius:8px 8px 0 0;
  color:#fff;
}
.board-col-head h4{font-size:14px; color:#fff;}
.board-col-head .sub-en{font-size:10px; color:rgba(255,255,255,0.75); font-family:'IBM Plex Mono',monospace; letter-spacing:0.04em;}
.board-col-body{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-top:none;
  border-radius:0 0 8px 8px;
  display:flex;
  flex-direction:column;
}
.board-cell{
  padding:9px 10px;
  border-bottom:1px solid var(--line-soft);
  min-height:58px;
  transition:background 0.12s;
}
.board-cell:last-child{border-bottom:none;}
.board-cell.dragover{background:rgba(201,162,39,0.16);}
.board-cell .cell-lbl{font-size:11px; font-weight:600; margin-bottom:6px; line-height:1.35;}
.board-cell .cell-n{font-family:'IBM Plex Mono',monospace; font-size:9px; opacity:0.55; margin-right:4px;}
.board-cell .cell-empty{font-size:11px; color:#B8AF98; font-style:italic;}
.board-pills{display:flex; flex-wrap:wrap; gap:5px;}
.pill{
  display:inline-flex; align-items:center; gap:5px;
  background:var(--paper); box-shadow:inset 0 0 0 1px var(--line);
  border-radius:20px; padding:4px 10px; font-size:11.5px; font-weight:500;
  cursor:grab; user-select:none;
}
.pill:active{cursor:grabbing;}
.pill.overridden{box-shadow:inset 0 0 0 1.5px var(--accent-deep); background:#FBF1D6;}
.pill .override-dot{width:6px; height:6px; border-radius:50%; background:var(--accent-deep);}
.unassigned-tray{
  background:var(--paper);
  border:1px dashed var(--line);
  border-radius:8px;
  padding:10px 12px;
  margin-bottom:14px;
}
.unassigned-tray .lbl{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; margin-bottom:8px; display:block;}

/* ---------- Notes: decision badges + edit ---------- */
.decision-badge{
  display:inline-block; font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:12px;
  margin-left:8px; font-family:'Inter';
}
.notes-compose select{width:100%;}
.note-entry .actions{display:flex; gap:10px;}
.note-entry .edit{color:var(--accent-deep); cursor:pointer; font-size:11px; font-weight:600;}
.compose-editing-flag{
  display:none; align-items:center; justify-content:space-between;
  background:#FBF1D6; border-radius:8px; padding:6px 12px; font-size:11.5px; margin-bottom:8px;
  box-shadow:inset 0 0 0 1px var(--accent);
}
.compose-editing-flag.show{display:flex;}
.compose-editing-flag a{color:var(--accent-deep); font-weight:700; cursor:pointer;}

/* ---------- Notes summary (printable) ---------- */
.notes-subnav{display:flex; gap:6px; margin-bottom:16px;}
.notes-subnav button{
  all:unset; cursor:pointer; padding:7px 14px; border-radius:20px; font-size:12.5px; font-weight:600;
  background:var(--paper-raised); box-shadow:inset 0 0 0 1px var(--line); color:var(--ink-soft);
}
.notes-subnav button.active{background:var(--ink); color:#fff; box-shadow:none;}
.notes-subnav .toggle-all{
  margin-left:auto; display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); font-weight:500;
}
.psum-card{
  background:var(--paper-raised); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:16px 20px; margin-bottom:14px; break-inside:avoid;
}
.psum-head{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:8px; flex-wrap:wrap;}
.psum-head h4{font-size:15px;}
.psum-head .role-line{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.psum-note{
  background:var(--paper); border-radius:8px; padding:10px 13px; margin-top:8px;
  box-shadow:inset 0 0 0 1px var(--line-soft);
}
.psum-note .meta{font-size:10.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; margin-bottom:4px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap;}
.psum-note .txt{font-size:12.5px; white-space:pre-wrap;}
@media print{
  .notes-subnav{display:none !important;}
  .psum-card{box-shadow:none; box-shadow:inset 0 0 0 1px var(--line);}
}
.tag-yer{
  display:inline-block; font-size:9.5px; font-family:'IBM Plex Mono',monospace;
  color:var(--ink-soft); background:var(--paper); padding:1px 6px; border-radius:8px;
  box-shadow:inset 0 0 0 1px var(--line-soft);
}
</style>

const DIMS = [
  {key:'courage',      label:'Courage',      idLabel:'Keberanian',     color:'#B54834'},
  {key:'opportunity',  label:'Opportunity',  idLabel:'Peluang',        color:'#C9A227'},
  {key:'realaction',   label:'Real Action',  idLabel:'Aksi Nyata',     color:'#4B7F52'},
  {key:'learning',     label:'Learning',     idLabel:'Pembelajaran',   color:'#3A6EA5'},
  {key:'contribution', label:'Contribution', idLabel:'Kontribusi',    color:'#6B4C8A'}
];
const DIM_BY_KEY = Object.fromEntries(DIMS.map(d=>[d.key,d]));

const BELT_COLORS = {
  WHITE:'var(--belt-white)', YELLOW:'var(--belt-yellow)', AMBER:'var(--belt-amber)',
  GREEN:'var(--belt-green)', BLUE:'var(--belt-blue)'
};
function beltOf(subgrade){
  if(!subgrade) return null;
  const m = subgrade.match(/\/\s*(WHITE|YELLOW|AMBER|GREEN|BLUE)/i);
  return m ? m[1].toUpperCase() : null;
}
function beltDotHTML(subgrade){
  const b = beltOf(subgrade);
  if(!b) return '<span class="belt-dot" style="background:#D8D2C2;"></span>';
  const extra = b==='WHITE' ? 'box-shadow:inset 0 0 0 1px var(--belt-white-line);' : '';
  return `<span class="belt-dot" style="background:${BELT_COLORS[b]};${extra}"></span>`;
}

function levelColor(dimKey, level){
  if(level==null) return '#C7C0AE';
  const base = DIM_BY_KEY[dimKey].color;
  // shade opacity by level (1..6) using color-mix fallback via rgba blend against paper
  const alphas = {1:0.3,2:0.45,3:0.6,4:0.75,5:0.9,6:1};
  return shadeHex(base, alphas[level]);
}
function shadeHex(hex, alpha){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const pr=250,pg=246,pb=239; // paper bg to blend "lightness" for lower levels
  const nr = Math.round(r*alpha + pr*(1-alpha));
  const ng = Math.round(g*alpha + pg*(1-alpha));
  const nb = Math.round(b*alpha + pb*(1-alpha));
  return `rgb(${nr},${ng},${nb})`;
}

function dimChip(dimKey, level, labelText, showText){
  const color = levelColor(dimKey, level);
  const txt = showText===false ? '' : `<span>${labelText||'—'}</span>`;
  const textColor = level==null ? '#fff' : (level>=4 ? '#fff' : '#241A05');
  return `<span class="dim-chip" style="background:${color}; color:${textColor};" title="${labelText||'Belum dinilai'}">
    <span class="lvln">${level!=null?level:'–'}</span>${txt}
  </span>`;
}

function avgLevel(list, dimKey, period){
  const vals = list.map(r=>r[period][dimKey+'_level']).filter(v=>v!=null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}

function overallLevel(rec, period){
  const vals = DIMS.map(d=>rec[period][d.key+'_level']).filter(v=>v!=null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}

/* ============ STORAGE ADAPTER ============ */
/* Falls back to localStorage when window.storage (Claude.ai artifact backend) isn't available,
   e.g. when this file is downloaded and opened directly in a browser. */
const LS_PREFIX = 'myr2026_';
let storageModePromise = null;
function ensureStorageMode(){
  if(!storageModePromise){
    storageModePromise = (async ()=>{
      try{
        if(window.storage && typeof window.storage.set === 'function'){
          const res = await window.storage.set('__probe__', 'ok', false);
          if(res) return 'claude';
        }
      }catch(e){ /* fall through */ }
      return 'local';
    })();
  }
  return storageModePromise;
}
async function storageGet(key, shared){
  const mode = await ensureStorageMode();
  if(mode==='claude'){
    try{ return await window.storage.get(key, shared); }catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem(LS_PREFIX+key);
    return raw!=null ? {key, value:raw, shared} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  const mode = await ensureStorageMode();
  if(mode==='claude'){
    try{ return await window.storage.set(key, value, shared); }catch(e){ return null; }
  }
  try{ localStorage.setItem(LS_PREFIX+key, value); return {key, value, shared}; }catch(e){ return null; }
}
async function storageListKeys(prefix, shared){
  const mode = await ensureStorageMode();
  if(mode==='claude'){
    try{ const r = await window.storage.list(prefix, shared); return r && r.keys ? r.keys : []; }catch(e){ return []; }
  }
  try{
    return Object.keys(localStorage)
      .filter(k=>k.startsWith(LS_PREFIX+prefix))
      .map(k=>k.slice(LS_PREFIX.length));
  }catch(e){ return []; }
}
function renderStorageBadge(){
  ensureStorageMode().then(mode=>{
    const el = document.getElementById('storageBadge');
    if(!el) return;
    if(mode==='claude'){
      el.innerHTML = '💾 Tersimpan di Claude — terlihat semua yang membuka link ini';
      el.title = 'Catatan dan papan kalibrasi tersimpan lewat Claude.ai dan bisa dilihat siapa pun yang membuka artifact/link ini.';
    } else {
      el.innerHTML = '💾 Tersimpan di browser ini — unduh cadangan berkala';
      el.title = 'File ini dibuka di luar Claude.ai, jadi data hanya tersimpan di browser & perangkat ini. Gunakan tombol Unduh Cadangan agar data tidak hilang.';
    }
  });
}

/* ---- Backup export / import ---- */
async function exportBackup(){
  const overridesRaw = await storageGet('board:overrides', true);
  const backup = { exportedAt: new Date().toISOString(), overrides: overridesRaw && overridesRaw.value ? JSON.parse(overridesRaw.value) : {}, notes:{} };
  const keys = await storageListKeys('note:', true);
  for(const k of keys){
    const res = await storageGet(k, true);
    backup.notes[k] = res && res.value ? JSON.parse(res.value) : [];
  }
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'myr2026_cadangan_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
async function importBackupFile(file){
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    if(backup.overrides){
      boardOverrides = backup.overrides;
      await storageSet('board:overrides', JSON.stringify(boardOverrides), true);
    }
    if(backup.notes){
      for(const [key, notes] of Object.entries(backup.notes)){
        await storageSet(key, JSON.stringify(notes), true);
      }
    }
    alert('Cadangan berhasil diimpor.');
    renderActivePage();
  }catch(e){
    alert('Gagal membaca file cadangan. Pastikan file .json hasil dari tombol Unduh Cadangan.');
  }
}


/* ---- Excel export (data + penilaian + catatan diskusi, mengikuti filter aktif) ---- */
async function exportExcel(){
  const btn = document.getElementById('exportExcelBtn');
  const oldTxt = btn ? btn.textContent : null;
  if(btn){ btn.textContent = '⏳ Menyiapkan...'; btn.disabled = true; }
  try{
    const data = filteredRecords();
    const rows = [];
    for(const r of data){
      const notes = await loadNotes('note:'+r.emp_id);
      const notesText = notes.slice().reverse().map(n=>{
        const cats = decisionsOf(n).map(c=>DECISION_META[c]?.label || c).join(', ');
        return `[${formatTs(n.ts)}] ${n.author}${cats?(' ('+cats+')'):''}: ${n.text}`;
      }).join('  |  ');
      rows.push({
        'NIP': r.nip || '',
        'Nama': r.name,
        'Role': r.role || '',
        'Grade': r.grade || '',
        'Sub Grade/Belt': r.subgrade || '',
        'Tipe Karyawan': r.emptype || '',
        'YOS': r.yos,
        'Superior': r.superior || '',
        'Divisi': r.division || '',
        'Departemen': r.department || '',
        'MYR Courage': r.myr.courage || '',
        'MYR Opportunity': r.myr.opportunity || '',
        'MYR Real Action': r.myr.realaction || '',
        'MYR Learning': r.myr.learning || '',
        'MYR Contribution': r.myr.contribution || '',
        'YER Courage': r.yer.courage || '',
        'YER Opportunity': r.yer.opportunity || '',
        'YER Real Action': r.yer.realaction || '',
        'YER Learning': r.yer.learning || '',
        'YER Contribution': r.yer.contribution || '',
        'Catatan Diskusi (Kronologis)': notesText,
      });
    }
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = Object.keys(rows[0]||{'a':1}).map(k=>({wch: Math.min(50, Math.max(12, k.length+4))}));
    XLSX.utils.book_append_sheet(wb, ws, 'MYR 2026 Marketing');

    const groups = {};
    data.forEach(r=>{ const s=r.superior||'(Tanpa superior tercatat)'; (groups[s]=groups[s]||[]).push(r); });
    const supRows = Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length).map(sup=>{
      const list = groups[sup];
      const row = { 'Superior': sup, 'Jumlah Anggota': list.length };
      DIMS.forEach(d=>{
        const avg = avgLevel(list, d.key, 'myr');
        row['Avg '+d.label] = avg!=null ? Number(avg.toFixed(2)) : '';
      });
      return row;
    });
    const ws2 = XLSX.utils.json_to_sheet(supRows);
    ws2['!cols'] = Object.keys(supRows[0]||{'a':1}).map(k=>({wch: Math.max(14, k.length+2)}));
    XLSX.utils.book_append_sheet(wb, ws2, 'Ringkasan per Superior');

    const generalRes = await storageGet('note:general', true);
    const generalNotes = generalRes && generalRes.value ? JSON.parse(generalRes.value) : [];
    if(generalNotes.length){
      const genRows = generalNotes.map(n=>({
        'Waktu': formatTs(n.ts),
        'Penulis': n.author,
        'Kategori': decisionsOf(n).map(c=>DECISION_META[c]?.label || c).join(', '),
        'Catatan': n.text
      }));
      const ws3 = XLSX.utils.json_to_sheet(genRows);
      XLSX.utils.book_append_sheet(wb, ws3, 'Catatan Umum');
    }

    XLSX.writeFile(wb, 'MYR2026_Marketing_' + new Date().toISOString().slice(0,10) + '.xlsx');
  }catch(e){
    console.error(e);
    alert('Gagal membuat file Excel. Coba lagi ya.');
  }finally{
    if(btn){ btn.textContent = oldTxt; btn.disabled = false; }
  }
}

const state = {

  search:'',
  page:'overview',
  sortCol:'name', sortDir:1,
  notesSelectedEmp: null,
  notesCategoryFilter: new Set(),
};

function filteredRecords(){
  return RECORDS.filter(r=>{
    if(state.filters.division.length && !state.filters.division.includes(r.division)) return false;
    if(state.filters.department.length && !state.filters.department.includes(r.department)) return false;
    if(state.filters.role.length && !state.filters.role.includes(r.role)) return false;
    if(state.filters.superior.length && !state.filters.superior.includes(r.superior)) return false;
    if(state.filters.grade.length && !state.filters.grade.includes(r.grade)) return false;
    if(state.filters.emptype.length && !state.filters.emptype.includes(r.emptype)) return false;
    if(state.search){
      const s = state.search.toLowerCase();
      if(!(r.name||'').toLowerCase().includes(s) && !(r.role||'').toLowerCase().includes(s) && !(r.superior||'').toLowerCase().includes(s)) return false;
    }
    return true;
  });
}

  attachFilterEvents();
  if(openMselId){
    const inp = document.querySelector(`#msel-${openMselId} .msel-search`);
    if(inp){ inp.focus(); const v = inp.value; inp.value=''; inp.value=v; }
  }
}

function attachFilterEvents(){
  document.getElementById('searchBox').oninput = (e)=>{ state.search = e.target.value; renderActivePage(); };

  // Prevent clicks anywhere inside an open dropdown panel from bubbling to the
  // document-level "click outside to close" listener below (this was the bug
  // that made it look impossible to type into the search box: clicking into
  // the input itself was closing the panel before you could type anything).
  document.querySelectorAll('.msel-panel').forEach(panel=>{
    panel.onclick = (e)=> e.stopPropagation();
  });

  document.querySelectorAll('[data-msel]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = btn.getAttribute('data-msel');
      const wrap = document.getElementById('msel-'+id);
      const wasOpen = wrap.classList.contains('open');
      document.querySelectorAll('.msel.open').forEach(m=>m.classList.remove('open'));
      openMselId = null;
      if(!wasOpen){
        wrap.classList.add('open');
        openMselId = id;
        const inp = wrap.querySelector('.msel-search');
        if(inp) setTimeout(()=>inp.focus(), 0);
      }
    };
  });
  document.querySelectorAll('[data-msel-close]').forEach(a=>{
    a.onclick = (e)=>{ e.stopPropagation(); document.querySelectorAll('.msel.open').forEach(m=>m.classList.remove('open')); openMselId=null; };
  });
  document.querySelectorAll('[data-msel-clear]').forEach(a=>{
    a.onclick = (e)=>{
      e.stopPropagation();
      const key = a.getAttribute('data-filter');
      state.filters[key] = [];
      renderGlobalFilters();
      renderActivePage();
    };
  });
  document.querySelectorAll('[data-filter]').forEach(cb=>{
    if(cb.tagName!=='INPUT') return;
    cb.onchange = (e)=>{
      const key = cb.getAttribute('data-filter');
      const val = cb.value;
      const arr = state.filters[key];
      const idx = arr.indexOf(val);
      if(cb.checked && idx===-1) arr.push(val);
      if(!cb.checked && idx!==-1) arr.splice(idx,1);
      renderGlobalFilters(); // rebuild to refresh counts (open panel & search text preserved)
      renderActivePage();
    };
  });
  document.querySelectorAll('[data-msel-search]').forEach(inp=>{
    inp.onclick = (e)=> e.stopPropagation();
    inp.oninput = (e)=>{
      const id = inp.getAttribute('data-msel-search');
      mselSearchCache[id] = e.target.value;
      const q = e.target.value.toLowerCase();
      document.querySelectorAll(`#mselopts-${id} .msel-opt`).forEach(opt=>{
        opt.style.display = opt.getAttribute('data-opt-label').includes(q) ? 'flex' : 'none';
      });
    };
  });
}

function avgOf(arr){
  const vals = arr.filter(v=>v!=null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function trendText(cur, prev){
  if(cur==null || prev==null) return 'data tidak lengkap untuk dibandingkan';
  const diff = cur - prev;
  const arrow = diff>0.01 ? '▲' : diff<-0.01 ? '▼' : '▬';
  const color = diff>0.01 ? 'up' : diff<-0.01 ? 'down' : '';
  return `${arrow} ${Math.abs(diff).toFixed(2)} dari YER 2025 (${prev.toFixed(2)})`;
}

function renderDimChart(data){

  const yerVals = DIMS.map(d=>avgLevel(data, d.key, 'yer'));
  dimChart = new Chart(ctx, {
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'YER 2025', data:yerVals, backgroundColor:'#D8D2C2', borderRadius:4, maxBarThickness:28},
        {label:'MYR 2026', data:myrVals, backgroundColor: DIMS.map(d=>d.color), borderRadius:4, maxBarThickness:28},
      ]
    },
    options:{
      responsive:true,
      plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{family:'Inter', size:11}}}},
      scales:{ y:{ min:0, max:5, ticks:{stepSize:1, font:{family:'IBM Plex Mono', size:10}}, grid:{color:'#EEE7D6'} },
               x:{ ticks:{font:{family:'Inter', size:11}}, grid:{display:false} } }
    }
  });
}

function renderGradeChart(data){

  data.forEach(r=>{ counts[r.grade] = (counts[r.grade]||0)+1; });

  const palette = ['#B54834','#C9A227','#4B7F52','#3A6EA5','#6B4C8A','#8C6A14','#A65C3B'];
  gradeChart = new Chart(ctx, {
    type:'doughnut',
    data:{ labels, datasets:[{ data:labels.map(l=>counts[l]), backgroundColor:labels.map((_,i)=>palette[i%palette.length]), borderColor:'#FAF6EF', borderWidth:2 }] },
    options:{ responsive:true, plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{family:'Inter', size:11}}}} }
  });
}

function renderMovers(data){
  const withBoth = data.filter(r=>overallLevel(r,'myr')!=null && overallLevel(r,'yer')!=null)
    .map(r=>({ r, delta: sumLevels(r,'myr') - sumLevels(r,'yer') }));
  const up = withBoth.filter(x=>x.delta>0).sort((a,b)=>b.delta-a.delta).slice(0,5);
  const down = withBoth.filter(x=>x.delta<0).sort((a,b)=>a.delta-b.delta).slice(0,5);

  document.getElementById('moversUp').innerHTML = up.length ? up.map(x=>moverRow(x,true)).join('') : `<div class="empty-state">Belum ada data naik pada populasi ini.</div>`;
  document.getElementById('moversDown').innerHTML = down.length ? down.map(x=>moverRow(x,false)).join('') : `<div class="empty-state">Belum ada data turun pada populasi ini.</div>`;
}
function sumLevels(r, period){
  return DIMS.reduce((s,d)=> s + (r[period][d.key+'_level']||0), 0);
}
function moverRow(x, isUp){
  return `<div class="mover-row">
    <div><strong>${x.r.name}</strong><br><span style="color:var(--ink-soft); font-size:11px;">${x.r.role}</span></div>
    <div class="mover-delta ${isUp?'up':'down'}">${x.delta>0?'+':''}${x.delta}</div>
  </div>`;
}

let boardOverrides = {}; // { empId: { dimKey: levelNumber } }
let boardOverridesLoaded = false;
let boardOverrideTs = {}; // { empId: { dimKey: isoTimestamp } } — when each calibration change was made
let boardOverrideTsLoaded = false;

async function loadBoardOverrides(){
  try{
    const res = await storageGet('board:overrides', true);
    boardOverrides = res && res.value ? JSON.parse(res.value) : {};
  }catch(e){
    boardOverrides = {};
  }
  boardOverridesLoaded = true;
  try{
    const res2 = await storageGet('board:overrideTs', true);
    boardOverrideTs = res2 && res2.value ? JSON.parse(res2.value) : {};
  }catch(e){
    boardOverrideTs = {};
  }
  boardOverrideTsLoaded = true;
}
async function saveBoardOverrides(){
  try{ await storageSet('board:overrides', JSON.stringify(boardOverrides), true); }
  catch(e){ console.error('Gagal menyimpan papan kalibrasi', e); }
  try{ await storageSet('board:overrideTs', JSON.stringify(boardOverrideTs), true); }
  catch(e){ console.error('Gagal menyimpan waktu perubahan kalibrasi', e); }
}
function effectiveLevel(rec, dimKey){
  const o = boardOverrides[rec.emp_id];
  if(o && o[dimKey]!=null) return o[dimKey];
  const v = rec.myr[dimKey+'_level'];
  return v!=null ? v : null;
}
function isOverridden(rec, dimKey){
  const o = boardOverrides[rec.emp_id];
  const official = rec.myr[dimKey+'_level'];
  const officialVal = official!=null ? official : null;
  return !!(o && o[dimKey]!=null && o[dimKey]!==officialVal);
}

/* Any dimension a person was dragged to on the calibration board, with the
   before/after level — this is what lets us surface "siapa yang digeser,
   dari berapa ke berapa" anywhere outside the Sistem Penilaian page itself. */
function getCalibrationChanges(rec){
  const changes = [];
  DIMS.forEach(d=>{
    if(isOverridden(rec, d.key)){
      changes.push({ dim: d, from: rec.myr[d.key+'_level'], to: effectiveLevel(rec, d.key) });
    }
  });
  return changes;
}
function calibrationChangeCell(rec){
  const changes = getCalibrationChanges(rec);
  if(!changes.length) return `<span style="color:var(--ink-faint,var(--ink-soft)); font-size:11px;">–</span>`;
  return changes.map(c=>`<span class="decision-badge" style="background:${c.dim.color}22; color:${c.dim.color};" title="Diubah saat kalibrasi di Sistem Penilaian">${c.dim.idLabel}: ${c.from!=null?c.from:'–'}→${c.to}</span>`).join(' ');
}

function renderBoard(){
  const container = document.getElementById('boardContainer');
  const data = filteredRecords();

  container.innerHTML = `

function renderBoardCell(dimKey, level, label, data){
  const people = data.filter(r=> effectiveLevel(r, dimKey) === level);
  const dropAttrs = level===null ? '' : `data-drop-dim="${dimKey}" data-drop-level="${level}"`;
  return `
    <div class="board-cell" ${dropAttrs}>
      <div class="cell-lbl"><span class="cell-n">${level===null?'—':level}</span>${label}</div>
      <div class="board-pills">
        ${people.length ? people.map(r=>renderPill(r, dimKey)).join('') : `<span class="cell-empty">kosong${level!==null? ', seret nama ke sini':''}</span>`}
      </div>
    </div>
  `;
}

function renderPill(rec, dimKey){
  const over = isOverridden(rec, dimKey);
  const official = rec.myr[dimKey+'_level'];
  const officialTxt = official!=null ? official : 'belum dinilai';
  return `<span class="pill ${over?'overridden':''}" draggable="true" data-emp="${rec.emp_id}" data-dim="${dimKey}" title="${over? 'Klik untuk kembalikan ke penilaian resmi ('+officialTxt+')' : rec.role}">
    ${over?'<span class="override-dot"></span>':''}${rec.name}
  </span>`;
}

function attachBoardDnD(){
  document.querySelectorAll('.pill').forEach(p=>{
    p.addEventListener('dragstart', (e)=>{
      e.dataTransfer.setData('text/plain', JSON.stringify({empId:p.getAttribute('data-emp'), dimKey:p.getAttribute('data-dim')}));
      e.dataTransfer.effectAllowed = 'move';
    });
    p.addEventListener('click', async (e)=>{
      if(!p.classList.contains('overridden')) return;
      const empId = p.getAttribute('data-emp'), dimKey = p.getAttribute('data-dim');
      const rec = RECORDS.find(r=>r.emp_id===empId);
      if(boardOverrides[empId]) delete boardOverrides[empId][dimKey];
      if(boardOverrideTs[empId]) delete boardOverrideTs[empId][dimKey];
      await saveBoardOverrides();
      renderBoard();
      if(rec){
        const dimLabel = DIM_BY_KEY[dimKey].idLabel;
        const officialLevel = rec.myr[dimKey+'_level'];
        await logAutoNote(empId, `↺ Penilaian ${dimLabel} dikembalikan ke data resmi (Level ${officialLevel!=null?officialLevel:'belum dinilai'}).`);
      }
    });
  });
  document.querySelectorAll('.board-cell[data-drop-dim]').forEach(cell=>{
    cell.addEventListener('dragover', (e)=>{ e.preventDefault(); cell.classList.add('dragover'); });
    cell.addEventListener('dragleave', ()=>{ cell.classList.remove('dragover'); });
    cell.addEventListener('drop', async (e)=>{
      e.preventDefault();
      cell.classList.remove('dragover');
      let info;
      try{ info = JSON.parse(e.dataTransfer.getData('text/plain')); }catch(err){ return; }
      const targetDim = cell.getAttribute('data-drop-dim');
      if(info.dimKey !== targetDim) return; // only allow moving within the same dimension column
      const targetLevel = parseInt(cell.getAttribute('data-drop-level'), 10);
      const rec = RECORDS.find(r=>r.emp_id===info.empId);
      const prevLevel = rec ? effectiveLevel(rec, info.dimKey) : null;
      boardOverrides[info.empId] = boardOverrides[info.empId] || {};
      boardOverrides[info.empId][info.dimKey] = targetLevel;
      boardOverrideTs[info.empId] = boardOverrideTs[info.empId] || {};
      boardOverrideTs[info.empId][info.dimKey] = new Date().toISOString();
      renderBoard();
      await saveBoardOverrides();
      if(rec && prevLevel !== targetLevel){
        const dimLabel = DIM_BY_KEY[info.dimKey].idLabel;
        const fromTxt = prevLevel!=null ? ('Level '+prevLevel) : 'belum dinilai';
        await logAutoNote(info.empId, `🔄 Perubahan hasil kalibrasi — ${dimLabel}: ${fromTxt} → Level ${targetLevel}.`);
      }
    });
  });
}

function renderDimLadder(d){

    <div class="ladder">

        <div class="step" style="background:${levelColor(d.key, i+1)}; color:${i+1>=4?'#fff':'#241A05'};">
          <div class="n">LEVEL ${i+1}</div>
          <div>${lbl}</div>
        </div>`).join('')}

}

/* ============ DISTRIBUSI RATING PAGE ============ */
const LEVEL_TIERS = [1,2,3,4,5,6,'NA'];
const DIST_METRICS = [
  {key:'overall', label:'Overall (Rata-rata 5 Dimensi)'},
  ...DIMS.map(d=>({key:d.key, label:d.idLabel})),
];
const DIST_GROUP_FIELDS = [
  {key:'division', label:'Divisi', get:r=>r.division||'(Tanpa divisi)'},
  {key:'department', label:'Departemen', get:r=>r.department||'(Tanpa departemen)'},
  {key:'superior', label:'Superior', get:r=>r.superior||'(Tanpa superior)'},
  {key:'grade', label:'Grade', get:r=>r.grade||'(Tanpa grade)'},
  {key:'emptype', label:'Employment Type', get:r=>r.emptype||'(Tanpa tipe)'},
];

function levelBucket(rec, metricKey){
  if(metricKey==='overall'){
    const vals = DIMS.map(d=>rec.myr[d.key+'_level']).filter(v=>v!=null);
    if(!vals.length) return 'NA';
    return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  }
  const v = rec.myr[metricKey+'_level'];
  return v==null ? 'NA' : v;
}
function levelBucketColor(tier){
  if(tier==='NA') return '#8A93A0';
  const alphas = {1:0.35,2:0.5,3:0.65,4:0.8,5:0.92,6:1};
  return shadeHex('#8C6A14', alphas[tier]);
}

function renderDistribution(){
  const el = document.getElementById('page-distribution');
  const data = filteredRecords();
  if(!state.distGroupBy) state.distGroupBy = 'division';
  if(!state.distMetric) state.distMetric = 'overall';

  const tierCounts = {};
  LEVEL_TIERS.forEach(t=>tierCounts[t]=0);
  data.forEach(r=>{ tierCounts[levelBucket(r, state.distMetric)]++; });

  const cardsHtml = LEVEL_TIERS.map(t=>`
    <div class="dist-card ${state.distSelectedTier===String(t)?'active':''}" data-tier="${t}">
      <div class="dist-card-label" style="color:${levelBucketColor(t)};">${t==='NA'?'Belum Dinilai':'Level '+t}</div>
      <div class="dist-card-value">${tierCounts[t]}</div>
      <div class="dist-card-sub">orang</div>
    </div>
  `).join('');

  const groupField = DIST_GROUP_FIELDS.find(f=>f.key===state.distGroupBy);
  const groups = {};
  data.forEach(r=>{
    const key = groupField.get(r);
    if(!groups[key]) groups[key] = {};
    const t = levelBucket(r, state.distMetric);
    groups[key][t] = (groups[key][t]||0)+1;
  });
  const groupNames = Object.keys(groups).sort((a,b)=>{
    const totalA = Object.values(groups[a]).reduce((s,v)=>s+v,0);
    const totalB = Object.values(groups[b]).reduce((s,v)=>s+v,0);
    return totalB - totalA;
  });

  const colMax = {};
  LEVEL_TIERS.forEach(t=>{
    colMax[t] = Math.max(1, ...groupNames.map(name=>groups[name][t]||0));
  });
  const totalRow = {};
  LEVEL_TIERS.forEach(t=> totalRow[t] = groupNames.reduce((s,name)=>s+(groups[name][t]||0),0));

  function cellHtml(count, t){
    if(!count) return `<td></td>`;
    const intensity = count/colMax[t];
    const bg = `rgba(15,32,54,${(0.08 + intensity*0.42).toFixed(2)})`;
    return `<td style="background:${bg}; font-weight:${intensity>0.6?'700':'500'};">${count}</td>`;
  }

  const tableHtml = groupNames.length ? `
    <table>
      <thead>
        <tr>
          <th>${groupField.label.toUpperCase()}</th>
          ${LEVEL_TIERS.map(t=>`<th style="text-align:center;">${t==='NA'?'NA':'L'+t}</th>`).join('')}
          <th style="text-align:center;">TOTAL</th>
        </tr>
      </thead>
      <tbody>
        ${groupNames.map(name=>{
          const rowTotal = Object.values(groups[name]).reduce((s,v)=>s+v,0);
          return `<tr>
            <td class="name-cell"><div class="full">${name}</div></td>
            ${LEVEL_TIERS.map(t=>cellHtml(groups[name][t], t)).join('')}
            <td style="text-align:center; font-weight:700;">${rowTotal}</td>
          </tr>`;
        }).join('')}
        <tr style="background:#F1E4C6; font-weight:700;">
          <td>Total</td>
          ${LEVEL_TIERS.map(t=>`<td style="text-align:center;">${totalRow[t]}</td>`).join('')}
          <td style="text-align:center;">${data.length}</td>
        </tr>
      </tbody>
    </table>
  ` : `<div class="empty-state">Tidak ada data yang cocok dengan filter ini.</div>`;

  el.innerHTML = `
    <div class="footnote" style="margin-bottom:14px;">Total orang per hasil rating MYR 2026 dalam skala Level 1–6 (bukan huruf), mengikuti filter aktif di atas. Klik kartu level untuk melihat daftar orangnya.</div>
    <div class="panel" style="margin-bottom:16px;">
      <div class="panel-head">
        <div><h3 style="font-size:14px;">Lihat distribusi untuk</h3></div>
        <select id="distMetricSelect" style="max-width:280px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:12.5px;">
          ${DIST_METRICS.map(m=>`<option value="${m.key}" ${state.distMetric===m.key?'selected':''}>${m.label}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="dist-cards-grid">${cardsHtml}</div>
    <div class="panel">
      <div class="panel-head">
        <div><h3>Heatmap Distribusi</h3><div class="desc">Warna lebih gelap = jumlah orang lebih banyak di sel itu</div></div>
        <select id="distGroupBySelect" style="max-width:220px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:12.5px;">
          ${DIST_GROUP_FIELDS.map(f=>`<option value="${f.key}" ${state.distGroupBy===f.key?'selected':''}>${f.label}</option>`).join('')}
        </select>
      </div>
      <div class="table-scroll">${tableHtml}</div>
    </div>
    <div id="distDrilldown"></div>
  `;

  const metricSel = document.getElementById('distMetricSelect');
  if(metricSel) metricSel.onchange = (e)=>{ state.distMetric = e.target.value; state.distSelectedTier=null; renderDistribution(); };

  const sel = document.getElementById('distGroupBySelect');
  if(sel) sel.onchange = (e)=>{ state.distGroupBy = e.target.value; renderDistribution(); };

  document.querySelectorAll('.dist-card').forEach(c=>{
    c.onclick = ()=>{
      const t = c.getAttribute('data-tier');
      state.distSelectedTier = state.distSelectedTier===t ? null : t;
      renderDistribution();
    };
  });

  renderDistDrilldown(data);
}

function renderDistDrilldown(data){
  const wrap = document.getElementById('distDrilldown');
  if(!wrap) return;
  if(!state.distSelectedTier){ wrap.innerHTML=''; return; }
  const tierRaw = state.distSelectedTier;

  const people = data.filter(r=>levelBucket(r, state.distMetric)===tier).sort((a,b)=>a.name.localeCompare(b.name));
  const metricLabel = DIST_METRICS.find(m=>m.key===state.distMetric).label;

              return `<tr>
                <td class="name-cell person-link" data-emp="${r.emp_id}" style="cursor:pointer; color:var(--accent-deep); font-weight:600;">${r.name}</td>
                <td>${r.role||'–'}</td>

function personDimTrend(cur, prev){
  if(cur==null && prev==null) return {arrow:'–', cls:'flat', label:'Belum dinilai'};
  if(cur==null) return {arrow:'–', cls:'flat', label:'Belum dinilai tahun ini'};
  if(prev==null) return {arrow:'●', cls:'flat', label:'Baru dinilai tahun ini'};
  if(cur>prev) return {arrow:'▲', cls:'up', label:'Naik dari Level '+prev+' ke Level '+cur};
  if(cur<prev) return {arrow:'▼', cls:'down', label:'Turun dari Level '+prev+' ke Level '+cur};
  return {arrow:'●', cls:'flat', label:'Tetap di Level '+cur};
}
function overallTrend(cur, prev){
  if(cur==null && prev==null) return {arrow:'–', cls:'flat', label:'Belum dinilai'};
  if(cur==null) return {arrow:'–', cls:'flat', label:'Belum dinilai tahun ini'};
  if(prev==null) return {arrow:'●', cls:'flat', label:'Baru dinilai tahun ini'};
  const diff = cur-prev;
  if(diff>0.01) return {arrow:'▲', cls:'up', label:'Naik '+diff.toFixed(2)+' dari YER 2025'};
  if(diff<-0.01) return {arrow:'▼', cls:'down', label:'Turun '+Math.abs(diff).toFixed(2)+' dari YER 2025'};
  return {arrow:'●', cls:'flat', label:'Tetap dibanding YER 2025'};
}
function personTrendRow(rec){
  return `<div class="dim-row">${DIMS.map(d=>{
    const cur = rec.myr[d.key+'_level'], prev = rec.yer[d.key+'_level'];
    const t = personDimTrend(cur, prev);
    return `<span class="trend-mini ${t.cls}" style="border-color:${d.color};" title="${d.idLabel}: ${t.label}">${t.arrow}</span>`;
  }).join('')}</div>`;
}

/* ============ TAGGED PAGES (Expanded Role / Proposed Permanent / Priority) ============ */
async function getTaggedMatches(category, data){
  const noteKeys = await storageListKeys('note:', true);
  const empIdsWithNotes = new Set(noteKeys.filter(k=>k!=='note:general').map(k=>k.replace('note:','')));
  const candidates = data.filter(r=>empIdsWithNotes.has(r.emp_id));

  const matched = [];
  for(const r of candidates){
    const notes = await loadNotes('note:'+r.emp_id);
    const relevant = notes.filter(n=>decisionsOf(n).includes(category));
    if(relevant.length){
      matched.push({ r, latest: relevant[0], count: relevant.length });
    }
  }
  matched.sort((a,b)=> new Date(b.latest.ts) - new Date(a.latest.ts));
  return matched;
}

async function getPriorityMatches(category, data){
  const noteKeys = await storageListKeys('note:', true);
  const empIdsWithNotes = new Set(noteKeys.filter(k=>k!=='note:general').map(k=>k.replace('note:','')));
  const candidates = data.filter(r=>empIdsWithNotes.has(r.emp_id));

  const matched = [];
  for(const r of candidates){
    const notes = await loadNotes('note:'+r.emp_id);
    const relevant = notes.filter(n=>decisionsOf(n).includes(category));
    if(relevant.length){
      // Collect every OTHER category tagged anywhere in this person's notes —
      // these are the concrete action points already decided for them
      // (Expanded Role, Movement, Development, dst) alongside the priority flag.
      const actionCats = new Set();
      notes.forEach(n=>{
        decisionsOf(n).forEach(c=>{
          if(c!=='priority1' && c!=='priority2') actionCats.add(c);
        });
      });
      matched.push({ r, latest: relevant[0], count: relevant.length, actionCats: [...actionCats] });
    }
  }
  matched.sort((a,b)=> new Date(b.latest.ts) - new Date(a.latest.ts));
  return matched;
}

function dimTrendAnalysis(list){
  return DIMS.map(d=>{
    let up=0, down=0, flat=0;
    list.forEach(r=>{
      const cur = r.myr[d.key+'_level'], prev = r.yer[d.key+'_level'];
      if(cur==null || prev==null) return;
      if(cur>prev) up++;
      else if(cur<prev) down++;
      else flat++;
    });
    return {d, up, down, flat, total:up+down+flat};
  });
}

function renderAnalysisBlock(list){
  const analysis = dimTrendAnalysis(list);
  const withData = analysis.filter(a=>a.total>0);
  const worst = withData.slice().sort((a,b)=>b.down-a.down)[0];
  const best = withData.slice().sort((a,b)=>b.up-a.up)[0];
  return `
  <div class="analysis-block">
    <div class="analysis-title">📊 Analisa Tren vs YER 2025</div>
    ${worst && worst.down>0 ? `<div class="analysis-highlight down">⚠ <b>${worst.d.idLabel}</b> paling banyak turun — ${worst.down} dari ${worst.total} orang yang punya data pembanding.</div>` : ''}
    ${best && best.up>0 ? `<div class="analysis-highlight up">✓ <b>${best.d.idLabel}</b> paling banyak naik — ${best.up} dari ${best.total} orang.</div>` : ''}
    ${!withData.length ? `<div class="analysis-highlight" style="color:var(--ink-soft);">Belum ada data YER 2025 yang bisa dibandingkan untuk tim ini.</div>` : ''}
    <div class="analysis-grid">
      ${analysis.map(a=>`
        <div class="analysis-row">
          <div class="analysis-dim"><span class="dot" style="background:${a.d.color};"></span>${a.d.idLabel}</div>
          <div class="analysis-bar">
            ${a.total? `
              <div class="bar-seg up" style="flex:${a.up || 0.0001};" title="${a.up} naik"></div>
              <div class="bar-seg flat" style="flex:${a.flat || 0.0001};" title="${a.flat} tetap"></div>
              <div class="bar-seg down" style="flex:${a.down || 0.0001};" title="${a.down} turun"></div>
            ` : `<div class="bar-seg empty" style="flex:1;"></div>`}
          </div>
          <div class="analysis-counts">▲${a.up} ●${a.flat} ▼${a.down}</div>
        </div>
      `).join('')}
    </div>
  </div>`;
}

async function renderNotesSummaryBody(data){
  const body = document.getElementById('notesBody');
  const showAll = !!state.notesShowAll;
  const catFilter = state.notesCategoryFilter;
  const hasCatFilter = catFilter.size > 0;

  function passesFilter(n){
    if(!hasCatFilter) return true;
    const cats = decisionsOf(n);
    if(catFilter.has('__none__') && cats.length===0) return true;
    return cats.some(c=>catFilter.has(c));
  }

  // General note
  const generalRes = await storageGet('note:general', true);
  let generalNotes = generalRes && generalRes.value ? JSON.parse(generalRes.value) : [];
  generalNotes = generalNotes.filter(passesFilter);

  // Which employees have notes at all (fast path via key listing)
  const noteKeys = await storageListKeys('note:', true);
  const empIdsWithNotes = new Set(noteKeys.filter(k=>k!=='note:general').map(k=>k.replace('note:','')));

  const candidates = showAll ? data : data.filter(r=>empIdsWithNotes.has(r.emp_id));

  let notesPerEmp = await Promise.all(candidates.map(async r=>{
    const res = await storageGet('note:'+r.emp_id, true);
    const allNotes = res && res.value ? JSON.parse(res.value) : [];
    return { r, notes: allNotes.filter(passesFilter), totalBeforeFilter: allNotes.length };
  }));

  if(hasCatFilter && !showAll){
    notesPerEmp = notesPerEmp.filter(x=>x.notes.length>0);
  }

  const hasAnything = generalNotes.length || notesPerEmp.some(x=>x.notes.length);

  if(!hasAnything){
    const msg = hasCatFilter
      ? 'Tidak ada catatan yang cocok dengan kategori yang dipilih pada populasi terfilter ini.'
      : 'Belum ada catatan pada populasi terfilter ini. Tulis catatan dulu di tab "Tulis / Ubah Catatan", atau centang "Tampilkan yang belum ada catatan juga" di atas.';
    body.innerHTML = `<div class="panel"><div class="empty-state">${msg}</div></div>`;
    return;
  }

  let html = `<div class="footnote" style="margin-bottom:14px;">Ringkasan ini mengikuti filter aktif di atas (divisi/departemen/role/superior/grade/tipe)${hasCatFilter?' dan filter kategori catatan yang dipilih':''}. Gunakan tombol "⎙ Cetak / Simpan PDF" di kanan atas untuk mengunduhnya.</div>`;

  if(generalNotes.length){
    html += `
      <div class="psum-card">
        <div class="psum-head"><h4>💬 Catatan Umum</h4></div>
        ${generalNotes.map(n=>psumNoteHTML(n)).join('')}
      </div>`;
  }

  notesPerEmp.sort((a,b)=> b.notes.length - a.notes.length);
  html += notesPerEmp.map(({r, notes})=>`
    <div class="psum-card">
      <div class="psum-head">
        <div>
          <h4>${r.name}</h4>
          <div class="role-line">${r.role||'–'} ${r.division?(' · '+r.division):''}${r.superior?(' · Superior: '+r.superior):''}</div>
        </div>
        <div class="dim-row">${DIMS.map(d=>dimChip(d.key, r.myr[d.key+'_level'], null, false)).join('')}</div>
      </div>
      ${notes.length ? notes.slice().reverse().map(n=>psumNoteHTML(n)).join('') : `<div class="psum-note"><span class="txt" style="color:var(--ink-soft);">${hasCatFilter?'Tidak ada catatan yang cocok dengan kategori terpilih.':'Belum ada catatan.'}</span></div>`}
    </div>
  `).join('');

  body.innerHTML = html;
}

function psumNoteHTML(n){
  const cats = decisionsOf(n);
  return `
    <div class="psum-note">
      <div class="meta">
        <span>${n.author} · ${formatTs(n.ts)}${n.editedTs? ' · diubah '+formatTs(n.editedTs):''}</span>
        ${n.auto ? `<span class="decision-badge" style="background:#C9A22722; color:#8C6A14; margin-left:0;">🔄 Otomatis</span>` : ''}
        ${cats.map(c=>{ const dm = DECISION_META[c]; return dm ? `<span class="decision-badge" style="background:${dm.color}22; color:${dm.color}; margin-left:0;">${dm.label}</span>` : ''; }).join('')}
      </div>
      <div class="txt">${escapeHtml(n.text)}</div>
    </div>`;
}

async function loadNotes(key){
  try{
    const res = await storageGet(key, true);
    return res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    return [];
  }
}
async function saveNotes(key, notesArr){
  try{
    await storageSet(key, JSON.stringify(notesArr), true);
    return true;
  }catch(e){
    console.error('Gagal menyimpan catatan', e);
    return false;
  }
}

async function refreshNoteCounts(data){
  for(const r of data){
    const notes = await loadNotes('note:'+r.emp_id);
    const el = document.querySelector(`[data-cnt="${r.emp_id}"]`);
    if(el && notes.length){ el.style.display='inline-block'; el.textContent = notes.length; }
  }
}

async function renderNotesMain(){
  editingNoteId = null;
  const isGeneral = state.notesSelectedEmp === '__general__';
  const rec = isGeneral ? null : RECORDS.find(r=>r.emp_id===state.notesSelectedEmp);
  const key = isGeneral ? 'note:general' : 'note:'+state.notesSelectedEmp;
  const main = document.getElementById('notesMain');

  main.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div>
          <h3>${isGeneral ? 'Catatan Umum' : rec.name}</h3>
          <div class="desc">${isGeneral ? 'Catatan lintas tim / kebijakan umum hasil diskusi' : (rec.role + (rec.superior? ' · Superior: '+rec.superior : ''))}</div>
        </div>
      </div>
      ${!isGeneral ? `<div class="dim-row" style="margin-bottom:14px;">${DIMS.map(d=>dimChip(d.key, rec.myr[d.key+'_level'], d.idLabel, true)).join('')}</div>` : ''}

      <div class="notes-compose">
        <div class="compose-editing-flag" id="editingFlag">
          <span>✎ Sedang mengubah catatan</span>
          <a id="cancelEditBtn">Batal, tulis baru</a>
        </div>
        <textarea id="noteText" placeholder="Tulis hasil diskusi, keputusan kalibrasi, atau catatan tindak lanjut..."></textarea>
        <div class="row" style="display:block;">
          <div style="font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px;">Kategori Catatan (opsional, bisa lebih dari satu)</div>
          <div class="cat-chip-group" id="noteDecisions">
            ${DECISION_OPTIONS.map(o=>`
              <label class="cat-chip">
                <input type="checkbox" value="${o.v}">
                <span>${o.label}</span>
              </label>
            `).join('')}
          </div>
        </div>
        <div class="row">
          <input type="text" id="noteAuthor" placeholder="Nama kamu (opsional)">
          <button class="btn small" id="saveNoteBtn">Simpan Catatan</button>
        </div>
      </div>

      <div id="noteEntries"><div class="empty-state">Memuat catatan...</div></div>
    </div>
  `;

  document.getElementById('cancelEditBtn').onclick = ()=>{
    editingNoteId = null;
    document.getElementById('noteText').value='';
    document.getElementById('noteAuthor').value='';
    document.querySelectorAll('#noteDecisions input[type=checkbox]').forEach(cb=>cb.checked=false);
    document.getElementById('editingFlag').classList.remove('show');
    document.getElementById('saveNoteBtn').textContent = 'Simpan Catatan';
  };

  document.getElementById('saveNoteBtn').onclick = async ()=>{
    const txt = document.getElementById('noteText').value.trim();
    if(!txt) return;
    const author = document.getElementById('noteAuthor').value.trim() || 'Tanpa nama';
    const decisions = [...document.querySelectorAll('#noteDecisions input[type=checkbox]:checked')].map(cb=>cb.value);
    const notes = await loadNotes(key);
    if(editingNoteId){
      const idx = notes.findIndex(n=>n.id===editingNoteId);
      if(idx!==-1){
        notes[idx] = {...notes[idx], text:txt, author, decisions, editedTs:new Date().toISOString()};
      }
      editingNoteId = null;
      document.getElementById('editingFlag').classList.remove('show');
      document.getElementById('saveNoteBtn').textContent = 'Simpan Catatan';
    } else {
      notes.unshift({ id: Date.now()+'_'+Math.random().toString(36).slice(2,7), text: txt, author, decisions, ts: new Date().toISOString() });
    }
    const ok = await saveNotes(key, notes);
    if(ok){
      document.getElementById('noteText').value='';
      document.getElementById('noteAuthor').value='';
      document.querySelectorAll('#noteDecisions input[type=checkbox]').forEach(cb=>cb.checked=false);
      renderNoteEntries(key);
      const data = filteredRecords();
      refreshNoteCounts(data);
    }
  };

  renderNoteEntries(key);
}

async function renderNoteEntries(key){
  const wrap = document.getElementById('noteEntries');
  const notes = await loadNotes(key);
  if(!notes.length){
    wrap.innerHTML = `<div class="empty-state">Belum ada catatan. Tulis catatan pertama di atas.</div>`;
    return;
  }
  wrap.innerHTML = notes.map(n=>{
    const cats = decisionsOf(n);
    return `
    <div class="note-entry">
      <div class="meta">
        <span>${n.author} · ${formatTs(n.ts)}${n.editedTs? ' · <em>diubah '+formatTs(n.editedTs)+'</em>' : ''}</span>
        <span class="actions"><span class="edit" data-edit="${n.id}">Ubah</span><span class="del" data-del="${n.id}">Hapus</span></span>
      </div>
      <div class="txt">${escapeHtml(n.text)}</div>
      ${n.auto ? `<span class="decision-badge" style="background:#C9A22722; color:#8C6A14;">🔄 Otomatis dari Papan Kalibrasi</span>` : ''}
      ${cats.map(c=>{ const dm = DECISION_META[c]; return dm ? `<span class="decision-badge" style="background:${dm.color}22; color:${dm.color};">${dm.label}</span>` : ''; }).join('')}
    </div>
  `;
  }).join('');
  wrap.querySelectorAll('[data-del]').forEach(d=>{
    d.onclick = async ()=>{
      const id = d.getAttribute('data-del');
      const cur = await loadNotes(key);
      const next = cur.filter(n=>n.id!==id);
      await saveNotes(key, next);
      if(editingNoteId===id){
        editingNoteId=null;
        document.getElementById('editingFlag').classList.remove('show');
        document.getElementById('saveNoteBtn').textContent='Simpan Catatan';
      }
      renderNoteEntries(key);
      refreshNoteCounts(filteredRecords());
    };
  });
  wrap.querySelectorAll('[data-edit]').forEach(ed=>{
    ed.onclick = async ()=>{
      const id = ed.getAttribute('data-edit');
      const cur = await loadNotes(key);
      const n = cur.find(x=>x.id===id);
      if(!n) return;
      editingNoteId = id;
      document.getElementById('noteText').value = n.text;
      document.getElementById('noteAuthor').value = n.author==='Tanpa nama' ? '' : n.author;
      const cats = decisionsOf(n);
      document.querySelectorAll('#noteDecisions input[type=checkbox]').forEach(cb=>{
        cb.checked = cats.includes(cb.value);
      });
      document.getElementById('editingFlag').classList.add('show');
      document.getElementById('saveNoteBtn').textContent = 'Update Catatan';
      document.getElementById('noteText').focus();
    };
  });
}

function formatTs(iso){
  const d = new Date(iso);
  return d.toLocaleString('id-ID', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============ INIT ============ */
renderGlobalFilters();
renderActivePage();
renderStorageBadge();

// Load calibration board overrides right away (not only when the Sistem Penilaian
// page is opened) so pages like Rangkuman Semua Orang can show "siapa yang
// digeser di kalibrasi, dari level berapa ke berapa" from the moment the app loads.
loadBoardOverrides().then(()=>{ renderActivePage(); });

document.getElementById('exportExcelBtn').onclick = exportExcel;
document.getElementById('exportBackupBtn').onclick = exportBackup;
document.getElementById('importBackupBtn').onclick = ()=> document.getElementById('importBackupInput').click();
document.getElementById('importBackupInput').onchange = (e)=>{
  const file = e.target.files[0];
  if(file) importBackupFile(file);
  e.target.value = '';
};
